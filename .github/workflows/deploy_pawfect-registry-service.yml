# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - pawfect-registry-service

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://pawfectcareregistry-hybha2fbbedqcqe0.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_316cbd9b23204ed3bb1479d1f7729abe }}
        password: ${{ secrets.AzureAppService_ContainerPassword_44053765e7d645f49193397d748e9d9b }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        context: ./pawfect-registry-service
        push: true
        tags: pawfectcareregistry-hybha2fbbedqcqe0.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_316cbd9b23204ed3bb1479d1f7729abe }}/pawfect-registry:${{ github.sha }}
        file: ./pawfect-registry-service/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'pawfect-registry-service'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_7f2a7bea1c894476a99a0c26b23dbda9 }}
        images: 'pawfectcareregistry-hybha2fbbedqcqe0.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_316cbd9b23204ed3bb1479d1f7729abe }}/pawfect-registry:${{ github.sha }}'